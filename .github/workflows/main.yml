name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Install Playwright Chromium into project folder
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/ms-playwright
        run: python -m playwright install chromium

      - name: Build EXE with PyInstaller
        run: python -m PyInstaller ZoomDownloader.spec --noconfirm

      - name: Bundle Chromium and ffmpeg
        shell: pwsh
        run: |
          Copy-Item -Recurse -Force ms-playwright dist\ZoomDownloader\ms-playwright
          Invoke-WebRequest -Uri 'https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip' -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-tmp -Force
          Copy-Item (Get-ChildItem ffmpeg-tmp -Recurse -Filter ffmpeg.exe | Select-Object -First 1).FullName dist\ZoomDownloader\ffmpeg.exe

      - name: Build NSIS installer
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          New-Item -ItemType Directory -Force -Path installer-output | Out-Null
          Set-Location installer
          & "C:\Program Files (x86)\NSIS\makensis.exe" /DVERSION=1.1.0 setup.nsi

      - uses: actions/upload-artifact@v7
        with:
          name: ZoomDownloader-Setup
          path: installer-output/ZoomDownloader-Setup.exe
